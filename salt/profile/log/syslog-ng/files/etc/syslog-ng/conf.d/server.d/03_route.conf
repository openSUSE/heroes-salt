{{ pillar['managed_by_salt'] }}

# log pipeline taking our remote client logs and distributing them into files based on the matching filters
# we make use of "final" to stop further processing -
#  primarily to stop duplication if a given message would otherwise match multiple filters, but
#  also to avoid unnecessary further processing if no other filters are relevant
# according to the documentation, the "final" flag does not work in embedded log statements, but it appears to work fine here
log {
	source(src_remote);

	parser {
		# populate local $TAGS with tags found in metadata, which our clients populate with their local $TAGS
		tags-parser(
			template("${.SDATA.meta@7057.tags}")
		);
	};

	filter(not_localhost);

	# for debugging
	destination(dst_remote_raw);

	log {
		filter(kernel);
		destination(dst_remote_kernel);
		flags(final);
	};

	log {
		filter(rpm);
		destination(dst_remote_rpm);
		flags(final);
	};

	log {
		filter(user);
		destination(dst_remote_user);
		flags(final);
	};

	log {
		filter(mail);
		destination(dst_remote_mail);
		flags(final);
	};

	log {
		filter(haproxy);
		destination(dst_remote_haproxy);
		flags(final);
	};

	log {
		filter(zypp_history);
		destination(dst_remote_zypp_history);
		flags(final);
	};

	log {
		filter(rest);
		destination(dst_remote_messages);
	};

};

