{%- set gids = {
      'heroes': salt['group.info']('heroes')['gid'],
      'wheel': salt['group.info']('wheel')['gid'],
    }
-%}
{{ pillar['managed_by_salt'] }}

block destination myfile(filename()) {
	file(
		"/var/log/remote/${HOST}/`filename`"
		create-dirs(yes)
		dir-owner(0)
		dir-group({{ gids['heroes'] }})
		dir-perm(0750)
		owner(0)
		group({{ gids['heroes'] }})
		perm(0640)
		fsync(yes)
	);
};

destination dst_remote_raw {
	file(
		"/var/log/remote/${HOST}/raw"
		create-dirs(yes)
		dir-owner(0)
		dir-group({{ gids['heroes'] }})
		dir-perm(0750)
		owner(0)
		group({{ gids['wheel'] }})
		perm(0640)
		fsync(yes)
		template("${RAWMSG}\n")
	);
};

destination dst_remote_messages {
	myfile(filename("messages"));
};

destination dst_remote_mail {
	myfile(filename("mail"));
};

destination dst_remote_kernel {
	myfile(filename("kernel"));
};

destination dst_remote_user {
	myfile(filename("user"));
};

destination dst_remote_rpm {
	myfile(filename("rpm"));
};

destination dst_remote_zypp_history {
	myfile(filename("zypp_history"));
};

