{{ pillar['managed_by_salt'] }}

block destination myfile(filename()) {
	file(
		"/var/log/remote/${HOST}/`filename`"
		create-dirs(yes)
		dir-owner("root")
		dir-group("heroes")
		dir-perm(0750)
		owner("root")
		group("heroes")
		perm(0640)
		fsync(yes)
	);
};

destination dst_remote_raw {
	file(
		"/var/log/remote/${HOST}/raw"
		create-dirs(yes)
		dir-owner("root")
		dir-group("wheel")
		dir-perm(0750)
		owner("root")
		group("wheel")
		perm(0640)
		fsync(yes)
		template("${RAWMSG}\n")
	);
};

destination dst_remote_messages {
	myfile(filename("messages"));
};

destination dst_remote_mail {
	myfile(filename("mail"));
};

destination dst_remote_kernel {
	myfile(filename("kernel"));
};

destination dst_remote_user {
	myfile(filename("user"));
};

