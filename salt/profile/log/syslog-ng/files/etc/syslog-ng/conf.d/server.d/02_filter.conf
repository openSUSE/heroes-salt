{{ pillar['managed_by_salt'] }}

filter not_localhost {
	not host("{{ grains['host'] }}")
};

filter kernel {
	facility(kern)
};

filter user {
	facility(user)
};

filter mail {
	facility(mail)
};

filter haproxy {
	facility(local0);
	program("haproxy");
};

filter not_haproxy_ssl_handshake_failure {
	not message(" http/sock-[0-9]+: SSL handshake failure$");
};

filter zypp_history {
	facility(local0);
	tags("zypp",".source.src_zypp_history");
};

filter rpm {
	facility(user);
	program("[RPM]");  # RPM announces itself with square brackets
	tags(".source.src");
};

filter rest {
	facility(daemon..local7)  # all facilities coming after kern/user/mail ...
};

