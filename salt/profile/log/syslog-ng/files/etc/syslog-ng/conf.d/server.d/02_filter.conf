{{ pillar['managed_by_salt'] }}

filter not_localhost {
	not host("{{ grains['host'] }}")
};

filter kernel {
	facility(kern)
};

filter user {
	facility(user)
};

filter mail {
	facility(mail)
};

filter zypp_history {
	facility(local0);
	tags("zypp",".source.src_zypp_history");
};

filter rpm {
	facility(user);
	program("[RPM]");  # RPM announces itself with square brackets
	tags(".source.src");
};

filter rest {
	facility(daemon..local7)  # all facilities coming after kern/user/mail ...
	and
	not facility(syslog)      # ... except internal/syslogd messages
};

