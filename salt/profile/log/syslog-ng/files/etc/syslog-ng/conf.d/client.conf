{%- set roles = pillar.get('roles', []) -%}
{{ pillar['managed_by_salt'] }}

destination dst_loggerioo {
	network(
		"logger.infra.opensuse.org"
		ip-protocol({{ 4 if salt['pillar.get']('profile:log:syslog-ng:legacy-ip', false) else 6 }})
		port(601)
		disk-buffer(
			capacity-bytes(268435456)
			compaction(yes)
			dir("/var/spool/syslog-ng")
			prealloc(yes)
			reliable(yes)
		)
		flags(syslog-protocol)  # enable RFC5424
	);
};

{%- if 'mailserver' in roles %}
destination dst_pipe {
	pipe("/var/log/syslog");
};

filter postfix {
	program("postfix");
};

filter postfix_healthcheck {
	message("(?:dis)?connect from atlas[12]\.infra\.opensuse\.org");
};
{%- endif %}

source src_zypp_history {
	file(
		"/var/log/zypp/history",
		default-facility(local0)
		default-priority(info)
		multi-line-garbage("^#")           # ignore RPM scripts output
		multi-line-mode("prefix-garbage")  # enable the above
		multi-line-prefix("^[0-9]{4}-[0-9]{2}-[0-9]{2} ")  # lines starting with a date are the beginning of a message
		tags("zypp")
		flags(no-parse)
	);
};

rewrite rwr_sdata_tags {
	# inject local $TAGS into the structured log message metadata
	# we use this to populate $TAGS on the server with the client message $TAGS
	set(
		"${TAGS}"
		value(".SDATA.meta@7057.tags")
	);
};

log {
	source(src);  # the "src" source is defined in the default /etc/syslog-ng/syslog-ng.conf shipped with the package
	source(src_zypp_history);
	rewrite(rwr_sdata_tags);

	{%- if 'mailserver' in roles %}
	log {
		filter(postfix);

		log {
			filter(postfix_healthcheck);
			flags(final);
		};

		log {
			destination(dst_pipe);
		};
	};
	{%- endif %}

	log {
		destination(dst_loggerioo);
	};
};
