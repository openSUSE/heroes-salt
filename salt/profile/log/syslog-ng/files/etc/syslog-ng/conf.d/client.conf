{{ pillar['managed_by_salt'] }}

destination dst_loggerioo {
	network(
		"logger.infra.opensuse.org"
		ip-protocol(6)
		port(601)
		disk-buffer(
			capacity-bytes(268435456)
			compaction(yes)
			dir("/var/spool/syslog-ng")
			prealloc(yes)
			reliable(yes)
		)
		flags(syslog-protocol)  # enable RFC5424
	);
};

rewrite rwr_sdata_tags {
	# inject local $TAGS into the structured log message metadata
	# we use this to populate $TAGS on the server with the client message $TAGS
	set(
		"${TAGS}"
		value(".SDATA.meta@7057.tags")
	);
};

log {
	source(src);  # the "src" source is defined in the default /etc/syslog-ng/syslog-ng.conf shipped with the package
	rewrite(rwr_sdata_tags);
	destination(dst_loggerioo);
};

