{{ pillar['managed_by_salt'] }}

# Enable TCP listener
source src_remote {
	network(
		ip("::")
		ip-protocol(6)
		port(601)
		transport("tcp")
		max-connections(200)
		keep-hostname(yes)
		flags(store-raw-message,syslog-protocol)  # populate $RAWMSG and enable RFC5424
	);
};

@include "/etc/syslog-ng/conf.d/server.d/"

